name: Build

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.13"
  DATABASE_URL: sqlite:///./ci.db

jobs:
  build:
    name: Build backend
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Compile Python files
        run: uv run python -m compileall main.py database.py models.py

      - name: Verify FastAPI app imports
        run: uv run python -c "from main import app; print(f'Loaded {len(app.routes)} routes')"
